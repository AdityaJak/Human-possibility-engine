# Render Blueprint — Human Possibility Engine API (read-only public deployment).
# Field names follow https://render.com/docs/blueprint-spec (checked 2026-11-04).
#
# How to use: Render Dashboard → New → Blueprint → connect AdityaJak/Human-possibility-engine →
# branch claude/human-possibility-engine-yjujoc → Apply. Then set HPE_CORS_ORIGINS to the exact
# origins of the deployed web app(s). Full steps and verification: docs/DEPLOYMENT.md.
#
# Plan trade-off: `starter` (paid) keeps the service warm and allows the persistent disk below.
# `free` spins down after inactivity (first request waits for a cold start) and CANNOT have a disk
# (persistence is not available for free instances): to use it, set plan: free, delete the `disk`
# block, and set HPE_DATA_DIR=/app/data (pseudonymous Future Self demo records then vanish on redeploy).
services:
  - type: web
    name: hpe-api
    runtime: docker
    repo: https://github.com/AdityaJak/Human-possibility-engine
    branch: claude/human-possibility-engine-yjujoc
    region: oregon
    plan: starter
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - reports/**
        - infra/docker/api.Dockerfile
        - pyproject.toml
        - uv.lock
        - render.yaml
    disk:
      name: hpe-user-private-demo-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Public exposure: no simulation or experiment jobs can be started through the API.
      - key: HPE_READ_ONLY
        value: "1"
      # Committed stored real outputs are baked into the image (research lab, offline demo mode).
      - key: HPE_REPORTS_DIR
        value: /app/reports
      # Pseudonymous Future Self demo records (consent, decisions, reflections). Deletable by the user
      # via POST /privacy/delete. Not real-user data; see SECURITY.md before storing any.
      - key: HPE_DATA_DIR
        value: /data
      # Exact browser origins allowed to call the API, comma-separated. REPLACE with your frontend
      # origin(s), e.g. https://<project>.vercel.app,https://adityajak.github.io
      - key: HPE_CORS_ORIGINS
        value: https://adityajak.github.io
      - key: HPE_LLM_PROVIDER
        value: none
      - key: HPE_LLM_MAX_CALLS_PER_HOUR
        value: "0"
      # Public rate limits for Future Self POSTs (token bucket per client IP, per endpoint group).
      - key: HPE_RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: HPE_RATE_LIMIT_BURST
        value: "5"
      # Defensive caps even though runs cannot be started in read-only mode.
      - key: HPE_MAX_AGENTS_PER_RUN
        value: "200"
      - key: HPE_MAX_YEARS_PER_RUN
        value: "20"
      - key: HPE_MAX_CONCURRENT_JOBS
        value: "1"
      - key: HPE_SAVE_CHECKPOINTS
        value: "0"
      - key: PYTHONUNBUFFERED
        value: "1"
