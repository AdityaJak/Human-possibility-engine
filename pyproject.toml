[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-possibility-engine"
version = "0.1.0"
description = "Developmental-agent society simulator, learning benchmarks, and an honest Future Self decision-support prototype. Synthetic research prototype; not validated for predicting human futures."
readme = "README.md"
requires-python = ">=3.12"
# License intentionally unassigned: awaiting founder decision (see docs/ADRS/0007-license-and-visibility.md).
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "pydantic>=2.9,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pyyaml>=6.0,<7",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
  "hypothesis>=6.112,<7",
  "httpx>=0.27,<1",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
  "types-PyYAML>=6.0",
]
parquet = ["pyarrow>=17,<23"]
# Phase III research models (ADR-0009). CPU wheels: --index-url https://download.pytorch.org/whl/cpu
research = ["torch>=2.5,<2.6"]

[project.scripts]
hpe = "hpe.cli:main"

[tool.setuptools.packages.find]
where = ["packages", "apps/api"]
include = ["hpe*", "hpe_api*"]

[tool.pytest.ini_options]
pythonpath = ["packages", "apps/api"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "slow: long-running simulation or benchmark tests (deselect with -m 'not slow')",
  "integration: cross-package integration tests",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["apps/web", "reports", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "RUF046"]

[tool.ruff.lint.isort]
known-first-party = ["hpe", "hpe_api"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["packages", "apps/api"]
packages = ["hpe", "hpe_api"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["packages/hpe", "apps/api/hpe_api"]
branch = true
