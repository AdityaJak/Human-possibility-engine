# X3-E01 (exploratory, director): does explicit individual adaptation add value ON TOP OF the variance reduction a
# seed ensemble buys? The strongest restless4 comparator on tune is pop_gru_ens (0.7102, X3-B03); the best
# candidate F3 (0.7237) and best adapter bayes_head (0.7275) were single models. Here each is compared at equal
# ensemble size (5 members) with its tune-selected configuration fixed (no new search; 1 configuration each).
experiment_id: x3_e01_ensemble_restless4
title: Matched-ensemble control — 5-member ensembles of pop_gru, the F3 arbiter and the Bayesian-head adapter, restless4 tune
lane: director
hypothesis: (Exploratory.) If individual adaptation adds value beyond variance reduction, the F3 and bayes_head ensembles beat pop_gru_ens by about the single-model gain (0.004–0.009 nats/choice).
families: [restless4]
report_partition: tune
seed: 20261109
threads: 1
budget_s_per_model_family: 2700
models:
  pop_gru_ens:
    role: comparator
    fixed: {hidden: 32, lr: 0.01, dropout: 0.0, members: 5, max_epochs: 150, patience: 10, batch_size: 8}
  f3_ens:
    model: adaptive_ens
    role: candidate
    fixed:
      base: f3_arbiter
      members: 5
      base_config: {lr: 0.01, bandwidth: 0.3, dropout: 0.0, hidden: 32, backbone_seed: 1}  # F3 seeds its backbone from config; the wrapper shifts it per member (first attempt without it had 5 identical members)
    variants: [frozen, mismatched]
  bayes_head_ens:
    model: adaptive_ens
    role: comparator
    fixed:
      base: bayes_head
      members: 5
      base_config:
        backbone: {hidden: 32, lr: 0.01, dropout: 0.0, max_epochs: 150, patience: 10, batch_size: 8}
        backbone_seed: 273911918
        m: 10
        predictive: laplace
        prior_var: eb
    variants: [frozen]
