# X3-B02 (exploratory, evaluation team): the rest of the comparator pool on restless4 (primary family), tune.
# GRU-backbone adapters use the tune-selected pop_gru of X3-B01 as backbone: same configuration and the seed the
# runner gave that configuration (derive_seed(20261108, "restless4", "pop_gru", 3) % (2**31-1) = 273911918), so
# each adapter's [frozen] variant reproduces that pop_gru. Grids <= 24; budget 2700 CPU-s per model and family.
experiment_id: x3_b02_restless4
title: Comparator pool (adapters, hb_cog, pop_tf, ref_gru_p2) on restless4, tune partition
lane: science/validation-v3
hypothesis: (Exploratory.) Tune NLL of every pool member under equal caps; which comparator is strongest on restless4.
families: [restless4]
report_partition: tune
seed: 20261108
threads: 2
models:
  hb_cog:
    role: comparator
    grid: {c: [0.01, 0.1, 1.0], tau: [0.5, 1.0]}
    fixed: {state_features: [], reset_on_block: false}
    variants: [frozen, mismatched]
  ft_head:
    role: comparator
    grid: {m: [10, 25], n: [5, 20], lr: [0.003, 0.01, 0.03]}
    fixed: &bb
      backbone: {max_epochs: 150, patience: 10, batch_size: 8, dropout: 0.0, hidden: 32, lr: 0.01}
      backbone_seed: 273911918
    variants: [frozen, mismatched]
  bayes_head:
    role: comparator
    grid: {prior_var: [eb, 0.01, 0.03, 0.1, 0.3, 1.0], m: [10, 25], predictive: [map, laplace]}
    fixed: *bb
    variants: [frozen, mismatched]
  exemplar_mix:
    role: comparator
    grid: {w: [0.05, 0.1, 0.2, 0.4], bw: [0.25, 1.0, 4.0], decay: [1.0, 0.98]}
    fixed: *bb
    variants: [frozen, mismatched]
  ft_full:
    role: comparator
    grid: {n: [3, 10], lr: [0.001, 0.003], l2: [0.0, 1.0]}
    fixed: {m: 25, backbone: {max_epochs: 150, patience: 10, batch_size: 8, dropout: 0.0, hidden: 32, lr: 0.01}, backbone_seed: 273911918}
    variants: [frozen, mismatched]
  reptile_gru:
    role: comparator
    grid: {lr: [0.001, 0.003], n: [3, 10]}
    fixed: {m: 25, meta_lr: 0.5, meta_iters: 300, meta_batch: 4, backbone: {max_epochs: 150, patience: 10, batch_size: 8, dropout: 0.0, hidden: 32, lr: 0.01}, backbone_seed: 273911918}
    variants: [frozen, mismatched]
  ref_gru_p2:
    role: comparator
    grid: {hidden: [8, 12], lr: [0.003, 0.01]}
    fixed: {max_epochs: 15, patience: 4, window: 64}
  pop_tf:
    role: comparator
    grid: {window: [32, 128], lr: [0.001, 0.003], dropout: [0.0, 0.1]}
    fixed: {d_model: 32, layers: 2, heads: 4, max_epochs: 150, patience: 10, batch_size: 8}
notes:
  - "ref_gru_p2 is the Phase II numpy GRU refitted on Phase III dev with its Phase II grid and input (thesis pool item 1)."
  - "numpy BLAS threads pinned to 1 (OPENBLAS_NUM_THREADS=1) for this run: multi-threaded BLAS on small matrices was ~600x slower on the shared 4-core machine."
