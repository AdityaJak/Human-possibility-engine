# X3-B01 (exploratory, evaluation team): core population RNN comparators (pop_gru, pop_lstm) on the counted
# families with the post-X3-001a trainer defaults (batch 8, <= 150 epochs, patience 10, plateau lr halving).
# 12 configurations each (hidden x lr x input dropout), <= 2700 CPU-s per model and family; lapse grid and
# partitions from the runner. Selection and report on tune (exploratory; selection-optimistic).
experiment_id: x3_b01_pop_rnn
title: Population RNN comparators (pop_gru, pop_lstm) on the counted families, tune partition
lane: science/validation-v3
hypothesis: (Exploratory.) Establish the tune NLL of the core population RNN comparators under equal caps.
families: [restless4, garcia, described]
report_partition: tune
seed: 20261108
threads: 2
models:
  pop_gru:
    role: comparator
    grid: {hidden: [16, 32, 64], lr: [0.003, 0.01], dropout: [0.0, 0.2]}
    fixed: {max_epochs: 150, patience: 10, batch_size: 8}
  pop_lstm:
    role: comparator
    grid: {hidden: [16, 32, 64], lr: [0.003, 0.01], dropout: [0.0, 0.2]}
    fixed: {max_epochs: 150, patience: 10, batch_size: 8}
notes:
  - "Trainer defaults per director commit 8a3d72cb; budget 2700 CPU-s per model and family (configurations past the budget are recorded as skipped)."
