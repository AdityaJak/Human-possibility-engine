# X3-C01 (exploratory, research/adaptation): design-team candidates F1/F2/F3 and their ablations vs a
# same-size core pop_gru on restless4 (primary counted family); fit dev, select and report on tune.
# Equal treatment: every population network (pop_gru, F1/F3 backbone, F2 world model, F3 GRU challenger)
# is trained by core.nets.train with the core defaults (batch 8, <=150 epochs, patience 10, plateau halving).
# pop_gru gets lr x hidden x dropout (8 configs); candidate backbones search hidden x dropout at lr 0.01
# (4 configs). F1/F3 variants share one cached backbone per config (paired ablations). Adaptive candidates
# subclass core.adaptation.AdaptiveBase: the harness owns adapt / frozen / length-matched donor schedules.
# Run with OPENBLAS_NUM_THREADS=1 (small-matrix BLAS threading is pathological on the shared machine).
experiment_id: x3_c01_restless4
title: Design-team candidates (F3 episodic arbiter, F2 world model + policy, F1 individual latent) vs same-size pop_gru, restless4
lane: research/adaptation
hypothesis: >-
  (Exploratory.) Explicit individual adaptation (F3 episodic memory + learned gate, F2 individual policy
  posterior, F1 online latent) improves tune NLL over the same population network with its recurrent state
  running and over a same-size pop_gru.
families: [restless4]
report_partition: tune
seed: 20261108
threads: 2
models:
  pop_gru:
    role: comparator
    grid: {hidden: [12, 32], lr: [0.003, 0.01], dropout: [0.0, 0.2]}
  f3_arbiter:
    role: candidate
    grid: {hidden: [12, 32], dropout: [0.0, 0.2], bandwidth: [0.25, 0.5, 1.0]}
    fixed: {lr: 0.01}
    variants: [frozen, mismatched]
  f3_fixedmix:
    role: reference
    grid: {hidden: [12, 32], dropout: [0.0, 0.2], mix: [0.05, 0.15, 0.3]}
    fixed: {lr: 0.01, bandwidth: 0.5}
    variants: [frozen]
  f3_fixedshare:
    role: reference
    grid: {hidden: [12, 32], dropout: [0.0, 0.2], share: [0.01, 0.05, 0.2]}
    fixed: {lr: 0.01, bandwidth: 0.5}
    variants: [frozen]
  f3_gruepi:
    role: reference
    grid: {hidden: [12, 32], dropout: [0.0, 0.2]}
    fixed: {lr: 0.01, bandwidth: 0.5}
  f2_world_policy:
    role: candidate
    grid: {hidden: [12, 32], dropout: [0.0, 0.2], prior_scale: [0.5, 1.0, 2.0]}
    fixed: {lr: 0.01}
    variants: [frozen, mismatched]
  f2_delta:
    role: reference
    grid: {delta_alpha: [0.1, 0.3, 0.6], prior_scale: [0.5, 1.0, 2.0]}
    variants: [frozen]
  f1_latent:
    role: candidate
    grid: {hidden: [12, 32], dropout: [0.0, 0.2]}
    fixed: {lr: 0.01, m: 10}
    variants: [frozen, mismatched]
  f1_bolt:
    role: reference
    grid: {hidden: [12, 32], dropout: [0.0, 0.2]}
    fixed: {lr: 0.01, m: 10}
    variants: [frozen]
notes:
  - F1 ablations (f1_trait, f1_context, f1_fixedstep, f1_cavia) run in x3_c02_restless4_f1abl at the backbone config selected here for f1_latent (two-stage tune search; configurations counted in the architecture report).
