analysis:
  primary_metric: report_nll_per_choice
  primary_metric_definition: Mean over report-partition participants of each participant's mean negative log-likelihood (nats)
    of their actual free choices under teacher forcing, after lapse mixing. Instructed trials are learned from but not scored.
    Lower is better.
  n_bootstrap: 2000
  alpha: 0.05
  minimum_effect_of_interest: 0.02
  contrasts:
  - developmental - best reference (chosen on the report partition; exploratory)
  - developmental - best non-developmental model
  - best reference - ref_bias
  status_rule: exploratory — no verdict is issued from a dev pilot
validity_notes:
- Report partition = tune, on which hyper-parameters were also selected; numbers are selection-optimistic and exploratory.
- Every Psych-101 MCPL/IGT participant was fitted on or scored in Phase I; the other seven families are pristine.
- Registry policy classes and reference models get grids of equal size caps (<= 24) and the same lapse grid; fits at grid
  edges are flagged.
- Encodings (12 context features, reward normalisation to [0, 1]) are modelling choices shared by all models; block resets
  are visible only via obs.meta, which registry classes do not read.
- Teacher-forced one-step-ahead likelihood measures predictive fit to choice sequences, not generative realism.
