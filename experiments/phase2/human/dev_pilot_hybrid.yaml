# Phase II dev pilot B (exploratory): Candidate A on the pristine Gate-D families, equal-size grid of its own
# knobs (16 configs), committed BEFORE the run. report_partition: tune; the test partition is never touched.
kind: human_v2
experiment_id: p2_human_dev_pilot_hybrid
title: Phase II dev pilot B — Candidate A (hybrid_exemplar) vs strongest references on the three pristine families (exploratory;
  fit dev / select tune / report tune)
hypothesis: (Exploratory, dev/tune only.) Does Candidate A approach or beat the population-fitted GRU and the per-participant
  references on the pristine families named as Gate D primary/secondary? Informs the freeze decision; proves nothing.
falsification_criterion: Not applicable to a dev pilot. The confirmatory preregistration (Gate D) will require the candidate
  to beat the best reference by >= 0.02 nats/choice (paired 95% CI excluding 0) on the frozen test partition in >= 2 of 3
  preregistered families and not be worse by > 0.02 in any.
